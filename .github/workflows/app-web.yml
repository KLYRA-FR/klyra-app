# À chaque push sur main : construit l'app web du téléphone (export statique
# `out/`, le même que charge Electron), la garde en artefact et la met en
# ligne sur Vercel (projet `klyra-app`, adresse dans docs/APP-WEB.md).
# Sans les secrets VERCEL_TOKEN, VERCEL_ORG_ID et VERCEL_PROJECT_ID, la mise
# en ligne est sautée : seul l'artefact reste.
name: App web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-web
  cancel-in-progress: true

jobs:
  construire:
    name: Export statique de l'app web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 504 au téléchargement d'Electron (postinstall) : jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - name: Construire
        run: pnpm build
      - name: L'export contient la coque, le manifeste et chaque écran
        run: |
          for f in index.html chats.html chat.html planning.html equipe.html projets.html projet.html plus.html reglages.html routines.html artefacts.html serveurs.html manifest.webmanifest; do
            test -f "out/$f" || { echo "Manque out/$f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-web
          path: out/
          retention-days: 14
      # L'export est déjà construit : Vercel le sert tel quel (`--prebuilt`), sans rien reconstruire.
      - name: Mettre en ligne sur Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          node scripts/sortie-vercel.mjs
          npx --yes vercel@64.5.0 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
