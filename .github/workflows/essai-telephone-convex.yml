# Essai téléphone uniquement. Déploie les fonctions Convex de cc9f7bc
# sur la production déjà utilisée par l'app installée. Ne publie ni Mac ni Windows.
# Ne modifie pas SITE_URL ni PostShiba. Retiré après l'essai.
name: Essai téléphone Convex

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/essai-telephone-convex.yml

permissions:
  contents: read

jobs:
  convex:
    name: Fonctions Convex de l'essai
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc9f7bc012940c5bbf0811f581d8228403dbacb9
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Déployer les fonctions de cc9f7bc
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error title=Secret CONVEX_DEPLOY_KEY manquant::La clé de déploiement de production est absente."
            exit 1
          fi
          pnpm exec convex deploy --typecheck enable --codegen enable --message "essai telephone cc9f7bc"
