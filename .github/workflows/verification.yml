# À chaque pull request vers main : installe, construit et vérifie que l'app
# s'affiche, sur Ubuntu. Ne publie rien et n'utilise aucun secret.
# Le test complet sur Mac et Windows (app installable, Whisper) tourne à la
# publication, après la fusion (app.yml).
name: Vérification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  composio-mac:
    name: Composio, coffre et MCP sous Mac
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: pnpm build:electron && pnpm test:composio
      - run: env -u ELECTRON_RUN_AS_NODE pnpm test:composio:natif
      - run: env -u ELECTRON_RUN_AS_NODE pnpm test:composio:runtime
      - name: Jetons de session du compte d'équipe, trousseau du Mac
        timeout-minutes: 3
        run: env -u ELECTRON_RUN_AS_NODE pnpm test:jetons-compte

  verifier:
    name: Build, types, lint et smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm build:electron
      # Après le build : les types des routes sont générés par next build.
      - run: pnpm typecheck
      - name: Origine du téléphone, le 502 du tunnel se relance
        run: pnpm test:origine-telephone
      - name: Composio, API et sélection de comptes simulées
        run: pnpm test:composio
      - name: Apps en direct, OAuth des serveurs MCP (faux serveurs, vrai retour local)
        run: pnpm test:mcp-oauth
      - name: Comptes Claude indépendants, sans compte réel
        run: pnpm test:comptes-claude
      - name: Composio, IPC natif et serveur MCP réels, sans fournisseur externe
        run: |
          timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:composio:natif --no-sandbox
          timeout 180 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:composio:runtime --no-sandbox
          timeout 180 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:composio:interface --no-sandbox
      - name: Noms et extensions des fichiers Windows et Unix
        run: pnpm test:fichiers
      - name: Projet depuis GitHub, clonage et récupération (dépôt local, sans réseau)
        run: pnpm test:git
      - name: Mises à jour de l'app, fiche de secours et relances (sans réseau)
        run: pnpm test:maj
      # Les fonctions Convex (comptes, équipe) sur un backend en mémoire : aucun déploiement touché.
      - name: Convex, connexion et droits
        run: pnpm test:convex
      - name: Modèles KLYRA, versions et mise à jour des fiches installées
        run: pnpm test:modeles
      - name: Artefacts (rendus des agents, lecture de claude.ai) et dossier de chaque agent
        run: pnpm exec vitest run src/lib/rendus.test.ts && node --experimental-strip-types --test electron/artefacts-liste.test.mts electron/atelier.test.mts electron/document-isole.test.mts

      # Ubuntu 24.04 bloque le bac à sable de Chromium (espaces de noms
      # utilisateur) : on le rouvre pour ce test, sans toucher à l'app.
      - name: Autoriser le bac à sable d'Electron
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: L'app démarre et affiche l'interface
        run: |
          KLYRA_SMOKE_TEST=1 KLYRA_USER_DATA="$RUNNER_TEMP/klyra" \
            timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm exec electron .
      - name: Conversation d'équipe, menu « Plus d’options » et renommage
        run: timeout 180 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:conversation
      - name: Mise à jour des modèles KLYRA déjà installés, vrais gestes
        run: timeout 240 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:maj-modeles
      - name: Agents actifs, bibliothèque locale et assistant renommé (profils fictifs)
        run: timeout 240 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:agents
      - name: Premier lancement guidé, fournisseur local simulé et reprise après fermeture
        run: timeout 240 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:onboarding
      - name: Journal de consommation et rattrapage de l'historique
        run: timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm exec electron scripts/test-consommation.cjs
      - name: Jetons de session du compte d'équipe (écriture ratée, entrée illisible)
        run: timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm exec electron scripts/test-jetons-compte.cjs
      - name: Sons de l'app, rendus dans Chromium
        run: timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm exec electron scripts/test-sons.cjs
      - name: Navigateur de KLYRA, ce que les agents y font (page locale, profil temporaire)
        run: timeout 180 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:navigateur
      - name: Navigateur de KLYRA dans le Chrome du poste (Chrome du runner, profil temporaire)
        # Sans bac à sable : Ubuntu 24.04 refuse les espaces de noms dont il a besoin (le Chrome des postes garde le sien).
        run: |
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$(command -v google-chrome)" > "$RUNNER_TEMP/chrome" && chmod +x "$RUNNER_TEMP/chrome"
          KLYRA_CHROME_PATH="$RUNNER_TEMP/chrome" timeout 240 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:navigateur-chrome
      - name: Navigateur de KLYRA, l'onglet du panneau dans l'app
        run: timeout 240 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:navigateur-ecran
      - name: Coffre, secrets chiffrés et outils des agents (profil temporaire)
        run: timeout 120 xvfb-run -a env -u ELECTRON_RUN_AS_NODE pnpm test:coffre
      - name: Coffre, Réglages et carte sécurisée dans l'app
        run: timeout 240 xvfb-run -a -s "-screen 0 1440x900x24" env -u ELECTRON_RUN_AS_NODE pnpm test:coffre-ecran
      - name: Computer Use, relais entre les agents et le pilote
        run: pnpm test:relais
      - name: Computer Use local, aperçu d'une fenêtre (sans le pilote)
        run: pnpm test:apercu-fenetre
      - name: Routines, échéances et moteur (dossiers temporaires, sans agent)
        run: pnpm test:routines
      - name: Transport du parcours routines (preload et moteur réels, hôte et agent fictifs)
        run: node scripts/routines-browser-fixture.cjs --self-test
      - name: Moteurs des agents (registre, traduction de Codex) et changement de fournisseur
        run: pnpm test:moteurs && pnpm test:fournisseurs
      # Le vrai pilote (cua-driver épinglé) ; openbox, parce que le clic au premier plan veut un gestionnaire de fenêtres.
      - name: Computer Use, pilote, outils MCP, clic et frappe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openbox
          pnpm cua-driver
          timeout 150 xvfb-run -a -s "-screen 0 1600x1000x24" sh -c 'openbox & sleep 2; env -u ELECTRON_RUN_AS_NODE pnpm test:ordinateur'

  # Les mêmes tests sous Windows : dossier de l'app dans %APPDATA%, chemins en \, fins de ligne CRLF,
  # et Computer Use pour de vrai (cua-driver épinglé : outils MCP, capture, clic, frappe).
  windows:
    name: Consommation et Computer Use sous Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: pnpm build:electron
      - name: Comptes Claude indépendants sous Windows, sans compte réel
        run: pnpm test:comptes-claude
      - name: Composio, contrats, sélection et coffre natif Windows
        timeout-minutes: 5
        shell: pwsh
        run: |
          pnpm test:composio
          if ($LASTEXITCODE -ne 0) { throw "Les contrats Composio ont échoué." }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          pnpm test:composio:natif
          if ($LASTEXITCODE -ne 0) { throw "Le test natif Composio a échoué." }
          pnpm test:composio:runtime
          if ($LASTEXITCODE -ne 0) { throw "Le test MCP Composio a échoué." }
      - name: Noms et extensions des fichiers Windows et Unix
        run: pnpm test:fichiers
      - name: Modèles KLYRA, versions et mise à jour (fins de ligne CRLF)
        run: pnpm test:modeles
      - name: Journal de consommation et rattrapage de l'historique
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          pnpm exec electron scripts/test-consommation.cjs
          if ($LASTEXITCODE -ne 0) { throw "Le test de consommation a échoué sous Windows." }
      - name: Jetons de session du compte d'équipe, coffre de Windows (fichier verrouillé, entrée illisible)
        timeout-minutes: 3
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          pnpm exec electron scripts/test-jetons-compte.cjs
          if ($LASTEXITCODE -ne 0) { throw "Le test des jetons de session a échoué sous Windows." }
      - name: Sons de l'app et réglage des sons du système
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          pnpm exec electron scripts/test-sons.cjs
          if ($LASTEXITCODE -ne 0) { throw "Le test des sons a échoué sous Windows." }
      - name: Routines sous Windows (fichier, verrou, fuseaux)
        run: pnpm test:routines
      - run: pnpm cua-driver
      - name: Computer Use, pilote, outils MCP, clic et frappe
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          pnpm exec electron scripts/test-ordinateur.cjs
          if ($LASTEXITCODE -ne 0) { throw "Le test Computer Use a échoué sous Windows." }
