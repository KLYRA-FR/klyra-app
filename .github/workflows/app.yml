# À chaque push sur main : fabrique l'app pour Mac et pour Windows, vérifie
# qu'elle démarre et que la dictée (Whisper) se lance, puis la publie dans le
# dépôt public KLYRA-FR/klyra-app-versions (l'app seule, jamais le code).
# Les apps installées y trouvent la nouvelle version (electron/maj.ts).
# Les pull requests passent par verification.yml, qui ne publie rien.
name: App
# La branche deploy/memoire-digital-os fabrique les artefacts uniquement.
# Elle ne déploie pas Convex et ne publie pas de mise à jour générale.

on:
  push:
    branches: [main, deploy/memoire-digital-os]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'app' || format('app-preview-{0}', github.ref) }}
  cancel-in-progress: true

env:
  # Un numéro par publication : 0.1.<n° de l'exécution>, toujours croissant.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: npm pkg set version="$VERSION"
      # next build vérifie aussi les types (ceux des routes sont générés pendant le build).
      - run: pnpm build && pnpm build:electron && pnpm whisper && pnpm cua-driver && pnpm github:preparer
      # Le même certificat à chaque version : macOS garde les autorisations de l'app (cf. scripts/signer-mac.cjs).
      - name: Certificat de signature
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: sh scripts/importer-certificat-mac.sh
      - run: pnpm exec electron-builder --mac --publish never --config.directories.output=dist-app
      - name: La signature est stable d'une version à l'autre
        if: env.KLYRA_MAC_SIGN_IDENTITY != ''
        run: |
          codesign --display --requirements - dist-app/mac-arm64/KLYRA.app 2>&1 | tee "$RUNNER_TEMP/exigence.txt"
          # Ad hoc, l'exigence porte sur l'empreinte du binaire (cdhash), qui change à chaque version.
          grep -q 'certificate' "$RUNNER_TEMP/exigence.txt" && ! grep -q 'cdhash' "$RUNNER_TEMP/exigence.txt"

      - name: L'app démarre et affiche l'interface
        run: |
          KLYRA_SMOKE_TEST=1 KLYRA_USER_DATA="$RUNNER_TEMP/klyra" \
            perl -e 'alarm 120; exec @ARGV' dist-app/mac-arm64/KLYRA.app/Contents/MacOS/KLYRA
      - name: GitHub CLI embarqué répond
        run: dist-app/mac-arm64/KLYRA.app/Contents/Resources/github/gh --version | grep -q '2.103.3'
      - name: Whisper embarqué se lance
        run: dist-app/mac-arm64/KLYRA.app/Contents/Resources/whisper/whisper-server --help 2>&1 | grep -qi usage
      - name: cua-driver embarqué, avec la signature de son éditeur (Computer Use)
        run: |
          dist-app/mac-arm64/KLYRA.app/Contents/Resources/cua-driver/cua-driver --version 2>&1 | grep -q '0.34.0'
          codesign --display --verbose=2 dist-app/mac-arm64/KLYRA.app/Contents/Resources/cua-driver/cua-driver 2>&1 | grep -q 'Authority=Developer ID Application'

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/latest-mac.yml

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: npm pkg set version="$env:VERSION"
      - run: pnpm build
      - run: pnpm build:electron
      - run: pnpm whisper
      - run: pnpm cua-driver
      - run: pnpm github:preparer
      - run: pnpm exec electron-builder --win --publish never --config.directories.output=dist-app

      - name: L'app démarre et affiche l'interface
        shell: pwsh
        run: |
          $env:KLYRA_SMOKE_TEST = "1"
          $env:KLYRA_USER_DATA = "$env:RUNNER_TEMP\klyra"
          $p = Start-Process "dist-app\win-unpacked\KLYRA.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "L'app ne s'est pas arrêtée." }
          if ($p.ExitCode -ne 0) { throw "L'app n'affiche rien (code $($p.ExitCode))." }
      - name: Whisper embarqué se lance
        shell: pwsh
        run: |
          $sortie = & "dist-app\win-unpacked\resources\whisper\whisper-server.exe" --help 2>&1 | Out-String
          if ($sortie -notmatch "usage") { throw "whisper-server ne démarre pas : $sortie" }
      - name: GitHub CLI embarqué répond
        shell: pwsh
        run: |
          $sortie = & "dist-app\win-unpacked\resources\github\gh.exe" --version 2>&1 | Out-String
          if ($sortie -notmatch "2.103.3") { throw "GitHub CLI ne répond pas : $sortie" }
      - name: cua-driver embarqué répond (Computer Use)
        shell: pwsh
        run: |
          $sortie = & "dist-app\win-unpacked\resources\cua-driver\cua-driver.exe" --version 2>&1 | Out-String
          if ($sortie -notmatch "0.34.0") { throw "cua-driver ne répond pas : $sortie" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-app/*.exe
            dist-app/latest.yml

  # Les fonctions Convex de production (cf. docs/CONVEX-PLAN.md) : déployées avant la publication
  # de l'app, et compatibles avec la version précédente, qui les appelle encore pendant une heure.
  convex:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # github.com répond parfois 502 ou 504 au téléchargement d'Electron (au premier require, ou au postinstall sur Mac) : installé ici, jusqu'à 4 essais.
      - name: Dépendances (nouvel essai si GitHub ne répond pas)
        shell: bash
        run: for i in 1 2 3 4; do pnpm install --frozen-lockfile && node -e "require('electron')" && exit 0; [ $i -lt 4 ] && echo "::warning::pnpm install a échoué, nouvel essai dans $((i * 15)) s" && sleep $((i * 15)); done; exit 1
      - run: pnpm test:convex
      - name: Déployer les fonctions Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error title=Secret CONVEX_DEPLOY_KEY manquant::Ajoute la clé de déploiement de production de Convex dans le secret CONVEX_DEPLOY_KEY de ce dépôt, puis relance la publication."
            exit 1
          fi
          pnpm exec convex deploy --typecheck enable --message "App $VERSION"

  publier:
    if: github.ref == 'refs/heads/main'
    needs: [mac, windows, convex]
    runs-on: ubuntu-latest
    steps:
      - name: Le jeton de publication est configuré
        env:
          GH_TOKEN: ${{ secrets.VERSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Secret VERSIONS_TOKEN manquant::Ajoute un jeton fine-grained (Contents : lecture et écriture sur KLYRA-FR/klyra-app-versions) dans le secret VERSIONS_TOKEN de ce dépôt, puis relance la publication."
            exit 1
          fi
          # Une version ne peut pas être créée dans un dépôt vide : il lui faut au moins un commit.
          if ! gh api "repos/KLYRA-FR/klyra-app-versions/commits?per_page=1" --silent; then
            echo "::error title=Dépôt des versions inaccessible::KLYRA-FR/klyra-app-versions n'existe pas, est vide (créé sans README) ou VERSIONS_TOKEN n'y a pas accès."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: app
      # Les notes restent neutres : le dépôt des versions est public, le code et ses commits non.
      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.VERSIONS_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --repo KLYRA-FR/klyra-app-versions \
            --title "KLYRA $VERSION" \
            --notes "Nouvelle version de l’app de bureau KLYRA, pour Mac et Windows." \
            app/*
