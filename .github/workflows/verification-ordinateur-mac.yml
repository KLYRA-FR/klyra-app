# Pull requests qui touchent à Computer Use : sur un Mac, l'app est fabriquée
# (signature ad hoc) pour vérifier que cua-driver garde la signature de son
# éditeur, puis le test de bout en bout tourne avec le vrai pilote. Le runner
# n'a pas les autorisations de macOS : le test s'arrête alors à l'état
# « autorisations », et vérifie que les agents n'ont pas les outils. Sur un Mac
# Intel : les runners Apple Silicon de GitHub manquent souvent. Ne publie rien.
name: Vérification Mac (Computer Use)

on:
  pull_request:
    branches: [main]
    paths:
      - electron/ordinateur/**
      - cua-driver.lock.json
      - scripts/preparer-cua-driver.mjs
      - scripts/signer-mac.cjs
      - scripts/test-ordinateur.cjs
      - .github/workflows/verification-ordinateur-mac.yml

permissions:
  contents: read

concurrency:
  group: verification-ordinateur-mac-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ordinateur:
    name: Pilote, signature et outils sur Mac
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer
      - run: pnpm build && pnpm build:electron && pnpm whisper && pnpm cua-driver && pnpm github:preparer
      # Sur une PR, electron-builder ne signe rien : on force la signature ad hoc (aucun certificat ni secret ici),
      # pour que scripts/signer-mac.cjs tourne comme à la publication, avec son « codesign --deep ».
      - name: L'app signée garde la signature de cua-driver
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          pnpm exec electron-builder --mac --dir --publish never --config.directories.output=dist-app
          APP=$(ls -d dist-app/mac*/KLYRA.app | head -1)
          "$APP/Contents/Resources/cua-driver/cua-driver" --version | grep -q '0.34.0'
          SIGNATURE=$(codesign --display --verbose=2 "$APP/Contents/Resources/cua-driver/cua-driver" 2>&1)
          echo "$SIGNATURE"
          echo "$SIGNATURE" | grep -q 'Authority=Developer ID Application: Cua AI'
          codesign --verify --deep --strict "$APP"
      - name: Computer Use, pilote et outils
        run: env -u ELECTRON_RUN_AS_NODE perl -e 'alarm 180; exec @ARGV' pnpm test:ordinateur
